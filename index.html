  <body>
    <script>
      window.onerror = function(msg, url, line, col, error) {
        document.body.innerHTML += '<div style="position:fixed;top:50px;left:50px;background:red;color:white;padding:20px;z-index:999999;font-family:monospace;white-space:pre-wrap;">ERROR: ' + msg + '<br/>' + (error && error.stack ? error.stack : '') + '</div>';
      };
      window.addEventListener('unhandledrejection', function(event) {
        document.body.innerHTML += '<div style="position:fixed;top:50px;left:50px;background:red;color:white;padding:20px;z-index:999999;font-family:monospace;white-space:pre-wrap;">PROMISE REJECTION: ' + (event.reason && event.reason.stack ? event.reason.stack : event.reason) + '</div>';
      });
    </script>
    <a href="#main-content" class="sr-only focus:not-sr-only focus:fixed focus:top-4 focus:left-4 focus:z-[99999] focus:bg-cyan-600 focus:text-white focus:px-4 focus:py-2 focus:rounded">Skip to content</a>

    <script type="module" src="/src/main.tsx"></script>
  </body>
